; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = d1_mini

[env:d1_mini]
platform = espressif8266@~4.2.1
board = d1_mini_pro
framework = arduino
; 1 MB LittleFS — the default 16m14m FS is huge overkill for the few hundred
; bytes of settings + recipe we store, and this SDK has no small-FS 16m script.
; Addresses only 4 MB of the 16 MB chip; fine, we flash over serial (no OTA).
board_build.ldscript = eagle.flash.4m1m.ld
board_build.filesystem = littlefs
extra_scripts =
	pre:scripts/suppress_toolchain_warnings.py
	pre:scripts/generate_build_info.py
build_flags =
	-std=gnu++17
	; Suppress noisy dependency/framework warnings. build_src_flags below
	; re-enables warnings for project sources.
	-w
build_src_flags = -Wall -Wextra   ; warnings on our code only, not the libraries
build_unflags = -std=gnu++11
monitor_speed = 115200
check_tool = cppcheck
check_skip_packages = yes
check_src_filters =
	+<src/>
	+<lib/>
; unusedFunction: false positives — cppcheck analyses each file alone, can't see
;   cross-translation-unit use. badBitmaskCheck: ArduinoJson's `x | default` API.
check_flags = cppcheck: --suppress=*:*/.pio/* --suppress=unusedFunction --suppress=badBitmaskCheck
monitor_filters = esp8266_exception_decoder, default
lib_deps =
	bblanchon/ArduinoJson@^7.4.3
	paulstoffregen/OneWire@^2.3.8
	paulstoffregen/Time@^1.6.1
	milesburton/DallasTemperature@^4.0.6
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
	knolleary/PubSubClient@^2.8
	https://github.com/realholgi/encoder-1.git#b1cab867ed9616563260f8cd96c995eb1082ef03
;	paulstoffregen/Encoder  ; missing on esp8266 ISR_ATTR

; Serial debug build: pio run -e d1_mini_debug -t upload
[env:d1_mini_debug]
extends = env:d1_mini
build_flags = ${env:d1_mini.build_flags} -D DEBUG

; Flash over WiFi: pio run -e d1_mini_ota -t upload  (board must be reachable)
[env:d1_mini_ota]
extends = env:d1_mini
upload_protocol = espota
upload_port = bk.local

; Host env for unit-testing pure logic (no hardware). `pio test -e native`.
[env:native]
platform = native
build_flags = -std=gnu++17
build_src_flags = -Wall -Wextra
test_build_src = true
; only hardware-free sources compile on the host
build_src_filter = -<*> +<display_format.cpp> +<settings.cpp> +<recipe_parse.cpp> +<temp_filter.cpp> +<manual_control.cpp> +<temperature_control.cpp> +<recipe_timing.cpp> +<brew_status.cpp> +<brew_history.cpp> +<history_export.cpp>
extra_scripts = pre:scripts/generate_build_info.py
lib_deps = bblanchon/ArduinoJson@^7.4.3
