; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = d1_mini

[env:d1_mini]
platform = espressif8266@~4.0.1
board = d1_mini_pro
framework = arduino
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, default
lib_deps =
	bblanchon/ArduinoJson@^6.17.2
	paulstoffregen/OneWire@^2.3.7
	paulstoffregen/Time@^1.6.1
	milesburton/DallasTemperature@^3.9.1
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
	https://github.com/soligen2010/encoder
;	paulstoffregen/Encoder  ; missing on esp8266 ISR_ATTR

; Host env for unit-testing pure logic (no hardware). `pio test -e native`.
[env:native]
platform = native
build_flags = -std=gnu++17
test_build_src = true
; only hardware-free sources compile on the host
build_src_filter = -<*> +<display_format.cpp>
